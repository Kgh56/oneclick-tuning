# Baut das Windows-Programm für Kunden (programm/oneclick_programm.py) als .exe,
# startet es zur Probe auf Windows und stellt es unter "Releases" -> "programm" zum Download bereit.
name: Windows-Programm bauen

on:
  push:
    branches: [main]
    paths: ["programm/**", ".github/workflows/windows-programm.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install pyinstaller==6.11.1 "pywebview>=5.4,<6"

      - name: Versionsnummer festlegen (fortlaufend)
        shell: bash
        run: echo "${{ github.run_number }}" > programm/version.txt

      - name: .exe bauen
        run: pyinstaller --noconfirm --onefile --windowed --name OneClick-Solutions --icon programm/icon.ico --add-data "programm/version.txt;." programm/oneclick_programm.py

      - name: Selbsttest (fertige .exe starten, Fenster und Brücke prüfen)
        shell: bash
        run: |
          export ONECLICK_SELBSTTEST="$PWD/selbsttest.json"
          # WebView2 bricht auf den GitHub-Rechnern ab und zu beim Start ab (E_ABORT) - dann bis zu 3 Versuche
          for versuch in 1 2 3; do
            rm -f selbsttest.json
            timeout 240 ./dist/OneClick-Solutions.exe || echo "Programm-Ende: $?"
            echo "Ergebnis (Versuch $versuch):"; cat selbsttest.json; echo
            grep -q '"ui": true' selbsttest.json && break
            sleep 10
          done
          grep -q '"ui": true' selbsttest.json
          grep -q '"api": true' selbsttest.json
          grep -q '"speichern": true' selbsttest.json
          grep -q '"kennung": true' selbsttest.json
          grep -q '"update": true' selbsttest.json

      - name: Versionsdatei für das Auto-Update erzeugen
        shell: bash
        run: |
          python -c "import hashlib, json; d = open('dist/OneClick-Solutions.exe', 'rb').read(); json.dump({'version': int(open('programm/version.txt').read()), 'sha256': hashlib.sha256(d).hexdigest(), 'groesse': len(d)}, open('dist/version.json', 'w'))"
          cat dist/version.json

      - name: Als Download bereitstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view programm >/dev/null 2>&1 || \
            gh release create programm --title "OneClick Solutions – Windows-Programm" \
              --notes "Programm für Kunden: OneClick-Solutions.exe herunterladen und starten. Updates installiert das Programm danach selbst."
          # Erst die .exe, dann die Versionsdatei: Programme sehen die neue Version erst, wenn die .exe schon da ist
          gh release upload programm dist/OneClick-Solutions.exe --clobber
          # Uebergang: bereits installierte Programme mit altem Namen holen sich ihr Update noch unter dem alten Dateinamen
          cp dist/OneClick-Solutions.exe dist/OneClick-Tuning.exe
          gh release upload programm dist/OneClick-Tuning.exe --clobber
          gh release upload programm dist/version.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: OneClick-Solutions
          path: dist/OneClick-Solutions.exe
