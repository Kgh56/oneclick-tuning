# Baut das Windows-Programm für Kunden (kunde/oneclick_kunde.py + kunde/ui.html) als .exe,
# startet es zur Probe auf Windows und stellt es unter "Releases" -> "programm" zum Download bereit.
name: Windows-Programm bauen

on:
  push:
    branches: [main]
    paths: ["kunde/**", ".github/workflows/windows-programm.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install pyinstaller==6.11.1 "pywebview>=5,<6"

      - name: Versionsnummer festlegen (fortlaufend)
        shell: bash
        run: echo "${{ github.run_number }}" > kunde/version.txt

      - name: .exe bauen
        run: pyinstaller --noconfirm --onefile --windowed --name OneClick-Tuning --icon kunde/icon.ico --add-data "kunde/ui.html;." --add-data "kunde/version.txt;." kunde/oneclick_kunde.py

      - name: Selbsttest (fertige .exe starten, Oberfläche und Brücke prüfen)
        shell: bash
        run: |
          export ONECLICK_SELBSTTEST="$PWD/selbsttest.json"
          timeout 240 ./dist/OneClick-Tuning.exe || echo "Programm-Ende: $?"
          echo "Ergebnis:"; cat selbsttest.json; echo
          grep -q '"ui":true' selbsttest.json
          grep -q '"api":true' selbsttest.json
          grep -q '"dialog":true' selbsttest.json

      - name: Versionsdatei für das Auto-Update erzeugen
        shell: bash
        run: |
          python -c "import hashlib, json, os; d = open('dist/OneClick-Tuning.exe', 'rb').read(); json.dump({'version': int(open('kunde/version.txt').read()), 'sha256': hashlib.sha256(d).hexdigest(), 'groesse': len(d)}, open('dist/version.json', 'w'))"
          cat dist/version.json

      - name: Als Download bereitstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view programm >/dev/null 2>&1 || \
            gh release create programm --title "Windows-Programm" \
              --notes "Programm für Kunden: OneClick-Tuning.exe herunterladen und starten. Updates installiert das Programm danach selbst."
          # Erst die .exe, dann die Versionsdatei: Programme sehen die neue Version erst, wenn die .exe schon da ist
          gh release upload programm dist/OneClick-Tuning.exe --clobber
          gh release upload programm dist/version.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: OneClick-Tuning
          path: dist/OneClick-Tuning.exe
